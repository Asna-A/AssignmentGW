<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    
    <div class="container-fluid d-flex section">
        <div class="row">
        <div class="col-md-6 form-container">
                <h3  class="text-center heading">Log in</h3>
                <p class="text" >Welcome back!Login with your date that you entered during registeration</p>
                    
        
                <div class="mb-3">
                    <button type="button" class="btn btn-light form-control shadow bg-body rounded signin">
                        <img class="svggoogle" src="google-color-svgrepo-com.svg" alt=""></i> Sign in with Google
                    </button>
                </div>
                
                <div class="mb-3">
                    <button type="button" class="btn btn-light form-control shadow bg-body rounded signin">
                        <img class="svgfb" src="facebook-svgrepo-com.svg" alt=""></i> Sign in with Facebook
                    </button>
                </div>
                <div class="or-separator mb-3">
                    <div class="line"></div>
                    <span>or</span>
                    <div class="line"></div>
                </div>
                <div>
            </div>
                <div class="form-floating mb-3">
                    <input type="email" class="form-control emailPassword" id="floatingInput" placeholder="name@example.com">
                    <label for="floatingInput"><i class="fa-solid fa-envelope"></i> Email</label>
                </div>
        
                <div class="form-floating mb-3">
                    <input type="password" class="form-control emailPassword " id="floatingPassword" placeholder="Password">
                    <label for="floatingPassword"><i class="fa-solid fa-lock"></i> Password</label>
                </div>
        
                <div class="form-check mb-3 d-flex justify-content-between">
                    <div>
                    <input class="form-check-input" type="checkbox" value="" id="flexCheckDefault">
                    <label class="form-check-label" for="flexCheckDefault">Remember me</label>
                </div>
                <a href="#" class="link linkcolor">Forgot your Password</a>
            </div>       
                <div>
                    <button type="button" class="btn btn-secondary form-control mb-3 login">Login</button>
                </div>
                <div>
                    <div class="text-center">
                    <span>Don't have an account?</span><a class="link linkcolor" href="#">Register</a></div>
                </div>
            </div>
        <div class="col-md-6 cover"><img class="image" src="login_pic.png" alt="no image"></div>
    </div>
</div>
    
      
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>   
</body>
</html>
